name: "🔐 Test Mac Mini Production Connection"

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test-connection:
    name: Test GitHub → Tailscale → Mac Mini
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # ============================================================
      # 1. Kết nối Tailscale bằng GitHub OIDC
      # ============================================================
      - name: Kết nối Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci

      # ============================================================
      # 2. Kiểm tra Tailscale
      # ============================================================
      - name: Kiểm tra Tailscale Runner
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Tailscale status ==="
          tailscale status

          echo ""
          echo "=== Tailscale IP ==="
          tailscale ip -4

          echo ""
          echo "=== Mac Mini ==="
          tailscale status | grep "100.109.109.5"

      # ============================================================
      # 3. Kiểm tra SSH
      # ============================================================
      - name: SSH vào Mac Mini
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.MAC_MINI_SSH_HOST }}
          username: ${{ secrets.MAC_MINI_SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          timeout: 30s
          command_timeout: 60s
          script_stop: true
          script: |
            set -e

            echo "========================================"
            echo "SSH CONNECTION"
            echo "========================================"

            echo ""
            echo "Hostname:"
            hostname

            echo ""
            echo "User:"
            whoami

            echo ""
            echo "OS:"
            sw_vers

            echo ""
            echo "Architecture:"
            uname -m

            echo ""
            echo "SSH connection: SUCCESS"

      # ============================================================
      # 4. Kiểm tra Git
      # ============================================================
      - name: Kiểm tra Git và project
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.MAC_MINI_SSH_HOST }}
          username: ${{ secrets.MAC_MINI_SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          timeout: 30s
          command_timeout: 60s
          script_stop: true
          script: |
            set -e

            export PATH="/usr/local/bin:/opt/homebrew/bin:$PATH"

            echo "========================================"
            echo "GIT CHECK"
            echo "========================================"

            echo ""
            git --version

            echo ""
            echo "Project directory:"

            if [ ! -d "$HOME/tinhchuan" ]; then
              echo "ERROR: $HOME/tinhchuan không tồn tại."
              exit 1
            fi

            cd "$HOME/tinhchuan"

            echo "$PWD"

            echo ""
            echo "Git repository:"
            git rev-parse --is-inside-work-tree

            echo ""
            echo "Current branch:"
            git branch --show-current

            echo ""
            echo "Current commit:"
            git rev-parse --short HEAD

            echo ""
            echo "Remote:"
            git remote -v

      # ============================================================
      # 5. Kiểm tra Docker
      # ============================================================
      - name: Kiểm tra Docker
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.MAC_MINI_SSH_HOST }}
          username: ${{ secrets.MAC_MINI_SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          timeout: 30s
          command_timeout: 60s
          script_stop: true
          script: |
            set -e

            export PATH="/usr/local/bin:/opt/homebrew/bin:/Applications/Docker.app/Contents/Resources/bin:$PATH"

            echo "========================================"
            echo "DOCKER CHECK"
            echo "========================================"

            echo ""
            echo "Docker:"
            command -v docker
            docker --version

            echo ""
            echo "Docker Compose:"
            docker compose version

            echo ""
            echo "Docker daemon:"
            docker info >/dev/null

            echo "Docker daemon: RUNNING"

            echo ""
            echo "Running containers:"
            docker ps --format "table {{.Names}}\t{{.Image}}\t{{.Status}}"

      # ============================================================
      # 6. Tổng kết
      # ============================================================
      - name: Deployment readiness
        shell: bash
        run: |
          echo ""
          echo "========================================"
          echo "DEPLOYMENT READINESS"
          echo "========================================"
          echo ""
          echo "GitHub OIDC             : PASS"
          echo "Tailscale authentication: PASS"
          echo "Tailscale connectivity  : PASS"
          echo "SSH authentication      : PASS"
          echo "Mac Mini access         : PASS"
          echo "Git                     : PASS"
          echo "Project                 : PASS"
          echo "Docker                  : PASS"
          echo "Docker Compose          : PASS"
          echo ""
          echo "========================================"
          echo "READY FOR DEPLOYMENT"
          echo "========================================"
