name: "🔐 Test Tailscale SSH"

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test-tailscale-ssh:
    name: Test Tailscale + SSH
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Kết nối Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci

      - name: Kiểm tra Tailscale
        run: |
          echo "=== Tailscale status ==="
          tailscale status

          echo ""
          echo "=== Tailscale IP ==="
          tailscale ip -4

          echo ""
          echo "=== Kiểm tra Mac Mini ==="
          tailscale ip -1 hans-mac-mini

      - name: Test SSH tới Mac Mini
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.MAC_MINI_SSH_HOST }}
          username: ${{ secrets.MAC_MINI_SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          timeout: 30s
          command_timeout: 60s
          script: |
            echo "=== SSH connection successful ==="

            echo "Hostname:"
            hostname

            echo "User:"
            whoami

            echo "OS:"
            sw_vers

            echo "Tailscale IP:"
            tailscale ip -4

            echo "Docker:"
            docker --version

            echo "Docker containers:"
            docker ps
