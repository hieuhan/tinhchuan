name: "🔍 Debug GitHub OIDC"

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  debug-oidc:
    runs-on: ubuntu-latest

    steps:
      - name: Lấy GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          OIDC_TOKEN=$(curl -sSf \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api.tailscale.com")

          echo "OIDC token received"

          PAYLOAD=$(echo "$OIDC_TOKEN" | cut -d '.' -f2)

          PAYLOAD=$(python3 -c "
          import base64
          import json
          import sys

          value = sys.stdin.read().strip()
          value += '=' * (-len(value) % 4)

          data = base64.urlsafe_b64decode(value)
          claims = json.loads(data)

          safe_claims = {
              'iss': claims.get('iss'),
              'sub': claims.get('sub'),
              'aud': claims.get('aud'),
              'repository': claims.get('repository'),
              'repository_id': claims.get('repository_id'),
              'repository_owner': claims.get('repository_owner'),
              'repository_owner_id': claims.get('repository_owner_id'),
              'ref': claims.get('ref'),
              'workflow': claims.get('workflow'),
              'event_name': claims.get('event_name')
          }

          print(json.dumps(safe_claims, indent=2))
          " <<< "$PAYLOAD"
