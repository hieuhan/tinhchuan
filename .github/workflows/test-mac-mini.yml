name: "🔌 Test Mac Mini Connection"

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test-connection:
    name: Test Tailscale + SSH
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Kết nối Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
          ping: hans-mac-mini

      - name: Kiểm tra Tailscale
        run: |
          echo "=== Tailscale status ==="
          tailscale status

          echo "=== Tailscale ping ==="
          tailscale ping hans-mac-mini

      - name: Test SSH tới Mac Mini
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.MAC_MINI_SSH_HOST }}
          username: ${{ secrets.MAC_MINI_SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          timeout: 30s
          command_timeout: 60s
          script: |
            echo "=== Hostname ==="
            hostname

            echo "=== User ==="
            whoami

            echo "=== OS ==="
            sw_vers

            echo "=== Tailscale IP ==="
            tailscale ip -4

            echo "=== Docker ==="
            docker --version

            echo "=== Docker containers ==="
            docker ps
