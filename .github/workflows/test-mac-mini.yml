name: "Debug GitHub OIDC"

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  debug-oidc:
    runs-on: ubuntu-latest

    steps:
      - name: Lấy GitHub OIDC token
        shell: bash
        run: |
          set -euo pipefail

          OIDC_RESPONSE=$(curl -sSf \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api.tailscale.com")

          OIDC_TOKEN=$(echo "${OIDC_RESPONSE}" | jq -r '.value')

          if [ -z "${OIDC_TOKEN}" ] || [ "${OIDC_TOKEN}" = "null" ]; then
            echo "Không lấy được OIDC token"
            exit 1
          fi

          echo "OIDC token received"

          OIDC_TOKEN="${OIDC_TOKEN}" python3 <<'PY'
          import base64
          import json
          import os

          token = os.environ["OIDC_TOKEN"]

          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)

          claims = json.loads(
              base64.urlsafe_b64decode(payload)
          )

          safe_claims = {
              "iss": claims.get("iss"),
              "sub": claims.get("sub"),
              "aud": claims.get("aud"),
              "repository": claims.get("repository"),
              "repository_id": claims.get("repository_id"),
              "repository_owner": claims.get("repository_owner"),
              "repository_owner_id": claims.get("repository_owner_id"),
              "ref": claims.get("ref"),
              "workflow": claims.get("workflow"),
              "event_name": claims.get("event_name")
          }

          print(json.dumps(safe_claims, indent=2))
          PY
