      - name: Test SSH tới Mac Mini
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.MAC_MINI_SSH_HOST }}
          username: ${{ secrets.MAC_MINI_SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          timeout: 30s
          command_timeout: 60s
          script: |
            echo "=== SSH connection successful ==="

            echo "Hostname:"
            hostname

            echo "User:"
            whoami

            echo "OS:"
            sw_vers

            echo "Home:"
            echo "$HOME"

            echo "PATH:"
            echo "$PATH"

            echo "Docker:"
            command -v docker || true
            docker --version || true

            echo "Docker containers:"
            docker ps || true
