# =============================================================================
# GITHUB ACTIONS - Tự động deploy TinhChuan.vn
# GitHub Actions → Tailscale → SSH → Mac Mini → deploy.sh
# =============================================================================

name: "🚀 Deploy TinhChuan.vn"

on:
  # Tự động deploy khi push vào main.
  push:
    branches:
      - main
    paths-ignore:
      - "*.md"
      - "docs/**"

  # Cho phép deploy thủ công từ GitHub Actions.
  workflow_dispatch:
    inputs:
      deploy_part:
        description: "Phần cần deploy"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - frontend
          - backend

# Không cho phép nhiều deployment chạy đồng thời.
concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    name: "Deploy to Mac Mini"
    runs-on: ubuntu-latest

    # Giới hạn thời gian tối đa của toàn bộ job.
    timeout-minutes: 20

    steps:

      # =========================================================================
      # 1. Kết nối GitHub Runner vào Tailscale
      # =========================================================================

      - name: "🔐 Kết nối Tailscale"
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          tags: tag:ci

      # =========================================================================
      # 2. Chờ mạng Tailscale ổn định
      # =========================================================================

      - name: "⏳ Chờ Tailscale ổn định"
        run: sleep 10

      # =========================================================================
      # 3. Kiểm tra kết nối tới Mac Mini
      # =========================================================================

      - name: "🔎 Kiểm tra Mac Mini"
        env:
          MAC_MINI_HOST: ${{ secrets.MAC_MINI_SSH_HOST }}
        run: |
          set -e

          echo "========================================"
          echo "TAILSCALE STATUS"
          echo "========================================"

          tailscale status

          echo ""
          echo "========================================"
          echo "PING MAC MINI"
          echo "========================================"

          tailscale ping "$MAC_MINI_HOST"

      # =========================================================================
      # 4. SSH vào Mac Mini và chạy deploy.sh
      # =========================================================================

      - name: "🚀 Deploy qua SSH tới Mac Mini"
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.MAC_MINI_SSH_HOST }}
          username: ${{ secrets.MAC_MINI_SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22

          # Timeout kết nối SSH.
          timeout: 30s

          # Thời gian tối đa cho deploy.sh.
          command_timeout: 15m

          # Dừng ngay nếu script trả về exit code khác 0.
          script_stop: true

          script: |
            set -e

            PROJECT_DIRECTORY="$HOME/tinhchuan"
            DEPLOY_PART="${{ github.event.inputs.deploy_part || 'all' }}"

            echo "========================================"
            echo "TINHCHUAN.VN DEPLOYMENT"
            echo "========================================"

            echo "Hostname:"
            hostname

            echo ""
            echo "User:"
            whoami

            echo ""
            echo "Deploy part:"
            echo "$DEPLOY_PART"

            echo ""
            echo "GitHub commit:"
            echo "${{ github.sha }}"

            echo ""
            echo "========================================"
            echo "RUN DEPLOY SCRIPT"
            echo "========================================"

            cd "$PROJECT_DIRECTORY"

            bash scripts/deploy.sh "$DEPLOY_PART"